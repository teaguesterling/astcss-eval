language: typescript
operators:
  # Structure & Movement
  replaceWith:
    match: "${target}"
    params: [code]
    rewrite: "${code}"
    example:
      context:
        target: "const a = 1;"
        code: "const a = 2;"
      expected: "const a = 2;"

  append:
    match: "${target}"
    params: [code]
    rewrite: "${target}\n${code}"

  prepend:
    match: "${target}"
    params: [code]
    rewrite: "${code}\n${target}"

  addComment:
    match: "${target}"
    params: [text, pos]
    rewrite: |
      // ${text}
      ${target}
    example:
      context:
        text: "Autogenerated handler"
        target: "export function handle() {}"
      expected: |
        // Autogenerated handler
        export function handle() {}

  # Declarations & Signatures
  addDecorator:
    match: ".fn@target, .class@target"
    params: [decorator]
    rewrite: "@${decorator}\n${target}"
    example:
      context:
        decorator: "Injectable()"
        target: "class ApiService {}"
      expected: |
        @Injectable()
        class ApiService {}

  setAsync:
    match: ".fn:not(.async)@target"
    rewrite: "async ${target}"
    example:
      context:
        target: "function loadUser() {}"
      expected: "async function loadUser() {}"

  setVisibility:
    match: ".fn@target, .class@target"
    params: [vis]
    rewrite: "${vis} ${target}"
    example:
      context:
        vis: "public"
        target: "getUser() {}"
      expected: "public getUser() {}"

  # Expressions & Calls
  wrapAwait:
    match: ".call@target, .expr@target"
    rewrite: "await ${target}"
    example:
      context:
        target: "api.fetchProfile(userId)"
      expected: "await api.fetchProfile(userId)"

  wrapCall:
    match: ".call@target, .expr@target"
    params: [fn_name]
    rewrite: "${fn_name}(${target})"
    example:
      context:
        fn_name: "String"
        target: "status_code"
      expected: "String(status_code)"

  chainCall:
    match: ".call@target, .expr@target"
    params: [method, args]
    rewrite: "${target}.${method}(${args})"
    example:
      context:
        target: "res"
        method: "json"
        args: "{ status: 'ok' }"
      expected: "res.json({ status: 'ok' })"

  # Control Flow & Wrapping
  wrapWith:
    match: ".fn > .body@body"
    params: [context_expr, as_name]
    rewrite: |
      using ${as_name} = ${context_expr};
      ${body}
    example:
      context:
        context_expr: "openHandle('temp.dat')"
        as_name: "file"
        body: "file.write(bytes);"
      expected: |
        using file = openHandle('temp.dat');
        file.write(bytes);

  wrapInTry:
    match: ".fn > .body@body"
    params: []
    rewrite: |
      try {
      ${body|indent(4)}
      } ${handlers|map_join("catch (e if e instanceof {exc}) {\n    {body}\n}")}
      ${finally|if_present("finally {\n    {finally}\n}")}
    example:
      context:
        body: "const data = await req.json();"
        handlers:
          - exc: "SyntaxError"
            body: "return null;"
        finally: "req.destroy();"
      expected: |
        try {
            const data = await req.json();
        } catch (e if e instanceof SyntaxError) {
            return null;
        }
        finally {
            req.destroy();
        }
